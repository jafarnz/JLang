name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y binutils-riscv64-unknown-elf gcc-riscv64-unknown-elf
      - run: make
      - run: make test
      - run: make sanitize

  # Build the ESP32 firmware: the VM for the ESP32-S3 (Xtensa), native
  # RISC-V code for the ESP32-C6, and Glass.
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      matrix:
        include:
          - { dir: boards/esp32-vm, target: esp32s3 }
          - { dir: boards/esp32-vm, target: esp32c6 }
          - { dir: boards/esp32-vm, target: esp32c3 }
          - { dir: boards/esp32-riscv, target: esp32c6 }
          - { dir: boards/esp32-riscv, target: esp32c3 }
          - { dir: glass/firmware, target: esp32c6 }
    steps:
      - uses: actions/checkout@v4
      - run: command -v make || (apt-get update && apt-get install -y build-essential)
      - run: make
      - name: idf.py build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd ${{ matrix.dir }}
          idf.py set-target ${{ matrix.target }}
          idf.py build

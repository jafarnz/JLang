name: Something doesn't work
description: A program does the wrong thing, an error message is confusing, or jlang crashes.
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: The program
      description: The smallest JLang program that shows the problem.
      render: jlang
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Paste the output or error message.
    validations:
      required: true
  - type: input
    id: how
    attributes:
      label: How you ran it
      description: For example "jlang run on macOS", "the playground in Chrome", "the ESP32-C6 firmware".
    validations:
      required: true
